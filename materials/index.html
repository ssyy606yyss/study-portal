<body>
  <header class="site-header">

    <nav aria-label="メインメニュー">
      <ul class="menu">

        <label for="q">キーワードで探す</label>

      <label class="check"><input type="checkbox" id="fav-only"> ★のみ表示</label>
    </div>

    <div id="list"></div>

    <details id="form-details" class="panel">

      <div id="form-area"></div>
    </details>

  <footer class="site-footer">
